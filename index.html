<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fim das férias do Marco</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        text-align: center;
        padding: 40px;
    }

    #titulo {
        font-size: 3em;
        font-weight: bold;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    #contador {
        font-size: 2.5em;
        font-weight: bold;
        background: white;
        display: inline-block;
        padding: 20px 40px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    #data-limite {
        margin-top: 20px;
        font-size: 1.5em;
        color: #444;
        font-weight: bold;
    }

    #imagem-marco {
        margin-top: 30px;
    }

    #imagem-marco img {
        max-width: 500px;
        width: 100%;
        height: auto;
    }
</style>
</head>

<body>

<h1 id="titulo">
    <span style="color:#e40303">F</span>
    <span style="color:#ff8c00">i</span>
    <span style="color:#ffed00">m</span>
    <span>&nbsp;</span>

    <span style="color:#008026">d</span>
    <span style="color:#004dff">a</span>
    <span style="color:#750787">s</span>
    <span>&nbsp;</span>

    <span style="color:#e40303">f</span>
    <span style="color:#ff8c00">é</span>
    <span style="color:#ffed00">r</span>
    <span style="color:#008026">i</span>
    <span style="color:#004dff">a</span>
    <span style="color:#750787">s</span>
    <span>&nbsp;</span>

    <span style="color:#e40303">d</span>
    <span style="color:#ff8c00">o</span>
    <span>&nbsp;</span>

    <span style="color:#ffed00">M</span>
    <span style="color:#008026">a</span>
    <span style="color:#004dff">r</span>
    <span style="color:#750787">c</span>
    <span style="color:#e40303">o</span>
</h1>

<div id="contador">A calcular...</div>

<div id="data-limite">
    até 28 de agosto de 2026 às 17:00
</div>

<div id="imagem-marco">
    <img src="marco.png" alt="Fim das férias do Marco">
</div>

<script>

function atualizarContador() {

    // 28/08/2026 às 17:00
    const destino = new Date(2026, 7, 28, 17, 0, 0);

    const agora = new Date();
    const diff = destino - agora;

    if (diff <= 0) {
        document.getElementById("contador").innerHTML =
            "🎉 Acabaram as férias do Marco! 🎉";
        return;
    }

    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diff / (1000 * 60)) % 60);
    const segundos = Math.floor((diff / 1000) % 60);

    document.getElementById("contador").innerHTML =
        `${dias} dias, ${horas} horas, ${minutos} minutos e ${segundos} segundos`;
}

atualizarContador();
setInterval(atualizarContador, 1000);

</script>

</body>
</html>
